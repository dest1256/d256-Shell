# Release: push a tag v<version> (scripts/bump-version.sh prints the steps) and the builds are attached to a GitHub Release.
# Actions are pinned by commit SHA; permissions are minimal (contents: write only for the last job).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build
        shell: pwsh
        run: |
          cd ui; npm ci; npm run build; cd ..
          cargo install --locked tauri-cli --version "^2"
          cargo tauri build --no-bundle -- --locked
          New-Item -ItemType Directory -Force dist/d256Shell/data | Out-Null
          Copy-Item target/release/d256shell.exe dist/d256Shell/d256Shell.exe
          Compress-Archive -Path dist/d256Shell -DestinationPath dist/d256Shell.zip
          (Get-FileHash dist/d256Shell.zip -Algorithm SHA256).Hash.ToLower() + "  d256Shell.zip" | Out-File -Encoding ascii dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/d256Shell.zip
            dist/SHA256SUMS-windows.txt

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev dpkg-dev
      - run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/PKGBUILD
            dist/linux/SHA256SUMS.txt

  release:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "d256 Shell ${GITHUB_REF_NAME#v}" --generate-notes
