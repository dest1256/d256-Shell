[package]
name = "d256shell"
description = "d256 Shell — портативный SSH-клиент"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
d256shell-core = { path = "../crates/core" }
serde_json = "1.0.154"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "=2.8.1"
drag = "2.1.1"

[features]
# embed the built UI into the binary (what `cargo tauri build` enables); needed for plain `cargo build --release`
custom-protocol = ["tauri/custom-protocol"]
