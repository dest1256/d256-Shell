# cargo-deny policy (supply chain, section 12.3 of the task): crates.io only, no vulnerabilities,
# permissive licences only, no wildcard version requirements.
[graph]
targets = ["x86_64-pc-windows-msvc"] # the only shipped platform (Linux is the dev container only)

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `rsa` (Marvin attack, no fix): pulled in by russh for RSA host/user keys. d256 Shell performs no private-key
    # RSA operations (password login only, host keys are only verified), so the timing side channel is not reachable.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# d256 Shell's own crates are MIT-licensed (see LICENSE); publish = false keeps them off crates.io.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # our own crates reference each other by path
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
