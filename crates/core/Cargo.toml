[package]
name = "d256shell-core"
description = "d256 Shell core logic (no Tauri dependencies)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
chardetng = "=1.0.0"
encoding_rs = "=0.8.42"
argon2 = "0.6.0"
base64ct = { version = "1.8.3", features = ["alloc"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hmac = "0.13.0"
portable-pty = "0.9.0"
russh = "0.65.0"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
zeroize = "1.9.1"
